
name: Build KzinnAdmin EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar painel
        run: dotnet publish .\KzinnAdmin-Projeto\KzinnAdmin\desktop\KzinnAdmin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\publish

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: KzinnAdmin-Windows
          path: .\publish\KzinnAdmin.exe
